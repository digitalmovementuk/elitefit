<!-- 50-buybar · pricing lane · Version: v3.0 — 2026-10-02 · Changelog: v3.0 created.
     Phones only (< 760 px, CSS). Fixed region. State on #buybar[data-state="open|closed"] and html[data-buybar] (set by buybar.js); the WhatsApp button reads html[data-buybar] to lift above it.
     Price and tier name come from assets/data/passes.json (cheapest day pass); strings are data-copy slots. -->
<div aria-label="Buy a pass" class="buy" data-copy-attr="aria-label:pricing.buy_aria" data-state="closed" id="buybar" inert="" role="region">
<div class="buy__in">
<p class="buy__txt">
<span class="buy__lab" data-buy-label="">Day pass</span>
<span class="buy__price"><span class="buy__cur" data-buy-cur="">IDR</span> <span class="buy__num" data-buy-price=""></span></span>
</p>
<a class="buy__btn" data-buy-go="" href="#pricing"><span data-copy="pricing.buy_cta">Buy a pass</span></a>
</div>
<span data-copy="pricing.buy_label" data-lex="buy_label" hidden="">{tier} day pass</span>
</div>
