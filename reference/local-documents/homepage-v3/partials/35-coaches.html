<!-- 35-coaches.html · owner: coaches lane · Version: v3.0 — 2026-10-02
     Changelog: v3.0 created. Section "Coaches" (anchor #coaches): faces and names first, one native <details> per coach, rendered by assets/js/coaches.js.
     Everything about a coach is DATA, never typed here: names from assets/data/coaches.json, the classes and times derived from the real timetable (assets/data/schedule.club.json via timetable.js),
     portraits assets/img/coach-<id>.webp (read-only, classes lane), the section's own switches in assets/data/coaches-section.json. Copy slots: copy/slots/coaches.json.
     Facts: F-COA-01 to F-COA-06 (coaches), F-CLS-01, F-CLS-03, F-CLS-10 to F-CLS-16 (timetable); each rendered row also carries its own data-fact (from coaches-section.json).
     Flag: the portrait filed under Tinos is the club's TINOS-scaled.webp, which the club grid shows under "Martijn Taken" (F-COA-06); the pairing of portrait and name is to be confirmed by the club. The visible name stays "Tinos".
     Hooks: data-reveal on the head and the list wrapper (motion lane). Event on #coaches: ef:coaches:render {n} after the rows are in place.
     The four skeleton rows reserve the final row height (CLS 0); they are replaced, or removed with a calm message when the data does not load. -->
